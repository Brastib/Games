# Vorlage fuer ~/.config/wake-pc/config.ini
# install.sh legt die Datei an und fragt die Werte ab. Rechte: nur du (chmod 600),
# denn hier steht das Gmail-App-Passwort.

[wol]
# MAC-Adresse des Windows-PCs: am PC "ipconfig /all" -> Ethernet-Adapter -> "Physische Adresse"
# Format z. B. 1C-69-7A-12-34-56 (so zeigt es Windows) oder 1c:69:7a:12:34:56
mac =
# 255.255.255.255 reicht meistens. Falls nicht: Broadcast des Heimnetzes, z. B. 192.168.178.255
broadcast = 255.255.255.255
port = 9
# Optional: IP des Laptops, ueber die gesendet werden soll (nur bei mehreren Netzwerken noetig)
source_ip =

[gmail]
# Gmail-Konto, das der Laptop abfragt
user = dein.name@gmail.com
# App-Passwort (Google-Konto -> Sicherheit -> App-Passwoerter; braucht 2-Faktor-Anmeldung)
app_password =
# Erstes Wort des Betreffs, das den PC weckt
subject = WAKE-PC
# Optional, empfohlen: Geheimwort, das zusaetzlich im Betreff stehen muss ("WAKE-PC geheimwort")
secret =
# Erlaubte Absender, durch Komma getrennt. Leer = nur das Konto aus "user"
allowed_senders =
# Gesendete Mails an sich selbst landen bei Gmail im Posteingang
mailbox = INBOX
# Abfrage-Intervall in Sekunden
poll_interval = 30
# Aeltere Mails werden ignoriert (z. B. wenn der Laptop aus war)
max_age_minutes = 15
# Nach dem Wecken eine Bestaetigungsmail an den Absender schicken
confirm = yes

[check]
# Optional: IP oder Hostname des PCs. Dann wird nach dem Wecken per Ping geprueft,
# ob er hochgefahren ist. Windows blockiert Ping standardmaessig (siehe README).
pc_host =
online_timeout = 180
