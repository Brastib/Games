# Render-Blueprint: Render liest diese Datei und richtet den Bot automatisch ein.
# Kostenloser Plan. Render fragt beim Einrichten nach den Werten mit "sync: false".
# DASHBOARD_PASSWORD = Passwort fürs Web-Dashboard (steht nur bei Render, nie im Code).
# DISCORD_CLIENT_SECRET ist optional (zusätzlicher Login mit Discord) – leer lassen geht.
services:
  - type: web
    name: etc-bot
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TZ
        value: Europe/Berlin
      - key: DISCORD_TOKEN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
